# Профиль НТ + SLA (единый источник для инъекции и для проверки попадания).
#
# count    - абсолютная цель по числу запросов на 100% профиля (для каждого
#            измерения/label). Параметр --target_percent масштабирует их: k = %/100.
#            Проверка попадания: факт_успехов >= 95% от count*k и error% <= 5%.
# rampup   - сколько секунд отрезать от начала прогона перед расчётом.
# *pct     - глобальные SLA по времени отклика (мс). Можно переопределить
#            на конкретное измерение через sla_per_label.
#
# ВАЖНО про имена. Gatling пишет в simulation.log имя запроса из http("...").
# Чтобы не дублировать «сырые» имена вручную, профиль ссылается на Java Case-класс(ы)
# (request_classes) — там для каждой переменной указано имя запроса в логе.
# Тогда ключи count / sla_per_label можно писать ПО ИМЕНИ ПЕРЕМЕННОЙ Case
# (напр. UC01_POST_Licenses_Summary) — инструменты сами резолвят их в лог-имя.
# Можно и напрямую писать лог-имя (http("...")) — тоже сработает.

description: "Профиль НТ Licenses (пример)"
target_percent: 100      # дефолт; обычно задаётся параметром джобы TARGET_PERCENT
rampup: 0

# Глобальные SLA по времени отклика, мс
95pct: 1000
50pct: 500
rps: 50
error_count: 100

# Java Case-классы Gatling: имя переменной <-> имя запроса в логе (http("...")).
# Используются и для анализа (резолв ключей count), и для авторасчёта весов.
request_classes:
  - resources/LicensesCase.java

# Цели на 100% профиля. Ключи — имена переменных Case (см. request_classes).
count:
  UC01_POST_Licenses_Summary: 9000
  UC02_POST_Licenses_List: 200
  UC03_POST_Licenses_Details: 100
  UC04_POST_Licenses_CustomParams: 100

# Точечные SLA по времени отклика (мс). Ключ — имя переменной Case или лог-имя.
sla_per_label: {}
#   UC01_POST_Licenses_Summary:
#     95pct: 800

# ---------------------------------------------------------------------------
# Инъекция (для Gatling). profile_to_props.py генерит profile.properties,
# который читает Java-класс ProfileConfig.
#
# weights БОЛЬШЕ НЕ ЗАДАЮТСЯ вручную: вес каждого запроса в randomSwitch
# вычисляется автоматически как доля его count среди запросов сценария
# (список запросов сценария = переменные из его request_classes).
# Ключ веса в properties — имя переменной Case (choice-ключ в getWeight).
# target_percent масштабирует только users; соотношение весов не меняется.
# ---------------------------------------------------------------------------
injection:
  duration: 3600          # длительность активной фазы, сек (hold)
  rampup: 60              # сек разгон
  scenarios:
    Licenses:
      users: 50           # целевая интенсивность на 100% профиля
      request_classes:    # какие запросы входят в сценарий (для долей весов)
        - resources/LicensesCase.java
