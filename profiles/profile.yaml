# Профиль НТ + SLA (единый источник для инъекции и для проверки попадания).
#
# count    - абсолютная цель по числу запросов на 100% профиля (для каждого
#            измерения/label). Параметр --target_percent масштабирует их: k = %/100.
#            Проверка попадания: факт_успехов >= 95% от count*k и error% <= 5%.
# rampup   - сколько секунд отрезать от начала прогона перед расчётом.
# *pct     - глобальные SLA по времени отклика (мс). Можно переопределить
#            на конкретное измерение через sla_per_label.
#
# Имена измерений (ключи count) должны совпадать с именами запросов в
# simulation.log (поле name записи REQUEST).

description: "Профиль НТ efsFinmonWeb"
target_percent: 100      # дефолт; обычно задаётся параметром джобы TARGET_PERCENT
rampup: 0

# Глобальные SLA по времени отклика, мс
95pct: 3000
50pct: 3500
rps: 8
error_count: 50

# Ключи приведены к реальным именам запросов из simulation.log (поле name записи
# REQUEST). Сопоставление сделано по номеру UC; значения count (цели на 100%)
# перенесены из прежних логических имён. Служебные запросы (first_login, login,
# preLogin, newsLogin, settingsLogin, decrypt, create) намеренно НЕ включены.
count:
  "UC03_GET_/params": 1152                       # было UC03_AttachmentsParams
  "UC05_GET_/download/{fileid}": 144             # было UC05_Attachments_download
  "UC07_POST_/inform-list": 144                  # было UC07_FFL_informList
  "UC08_POST_/send-to-bank/{fflId}": 720         # ВНИМАНИЕ: было UC02_Sendtobank (номер сменился 02->08, сопоставлено по смыслу — проверить!)
  "UC09_GET_/requests-and-inform": 216
  "UC10_POST_/mop-1-0": 9144
  "UC11_POST_/online-control": 144
  "UC12_GET_/rehabilitation": 1800
  "UC13_GET_/unread-tabs": 144
  "UC14_POST_/detail": 1152                      # было UC14_callback_Detail
  "UC15_POST_/callback": 144                     # было UC15_Compliance_Callback
  "UC16_PUT_/callback": 144                      # было UC16_Compliance_Callback_Put
  "UC17_DELETE_/callback?taskId={taskIdCB}": 576 # было UC17_Callback_DeleteTask
  "UC18_GET_/compliance-helper": 240
  "UC19_GET_/activation": 216
  "UC20_GET_/change-tariff": 240
  "UC21_GET_/user-permissions": 1872
  "UC22_GET_/print-form": 144
  "UC23_GET_/rejections": 2448
  "UC24_GET_/rejection/{operationId}": 1872
  "UC25_GET_/active-switchers": 648
  "UC26_GET_/system-parameters": 144
  "UC27_GET_/organization": 72
  "UC28_GET_/compliance-profile/mtb": 648
  "UC29_GET_/dopInfo": 72
  "UC30_GET_/counterparties": 144
  "UC31_GET_/compliance-profile/contacts": 144
  "UC32_GET_/compliance-profile": 720
  "UC33_GET_/detail": 504                         # было UC33_compliance_Profile_detail
  "UC34_DELETE_/alert": 300
  "UC35_POST_/organization": 216
  "UC36_POST_/mtb": 216
  "UC37_POST_/dopInfo": 144
  "UC38_POST_/counterparties": 144
  "UC39_POST_/contacts": 144
  "UC40_GET_/mop2/{fflId}": 576
  "UC41_GET_/onboarding/{fflId}": 144
  # СПОРНЫЕ / НЕ НАЙДЕНЫ в этом логе — раскомментировать, когда узнаете реальное имя запроса:
  # "UC01_AttachmentsFileUpload": 576        # в логе нет запроса с номером UC01
  # "UC04_Attachments_deleteFile": 576       # в логе нет запроса с номером UC04
  # "UC06_FFL_detailWithAttachment": 72      # в логе нет запроса с номером UC06


# Необязательные точечные SLA по времени отклика (мс) на измерение.
# Ключи — реальные имена запросов из simulation.log. Пример:
# sla_per_label:
#   "UC10_POST_/mop-1-0":
#     95pct: 2000
sla_per_label: {}

# Ссылки на Java Case-классы Gatling (имя переменной <-> имя запроса в логе).
# Используются для анализа (резолв ключей count по именам переменных) и для
# авторасчёта весов randomSwitch. TODO: указать реальный путь к классу(ам)
# запросов вашей симуляции (аналог resources/LicensesCase.java), где
# объявлены все UCxx-запросы через http("...").
request_classes:
  - gatling/src/test/java/cases/efsFinmonWeb/FinmonWebCase.java   # TODO: заменить на реальный путь/класс(ы)

# ---------------------------------------------------------------------------
# Инъекция (для Gatling). profile_to_props.py генерит profile.properties,
# который читает Java-класс ProfileConfig.
#
# weights БОЛЬШЕ НЕ ЗАДАЮТСЯ вручную — вес каждого запроса в randomSwitch
# считается автоматически как доля его count среди запросов сценария.
# Список запросов сценария = переменные из request_classes ниже.
# target_percent масштабирует только users (users_eff = round(users*%/100));
# соотношение весов от этого не меняется.
# ---------------------------------------------------------------------------
injection:
  duration: 600           # длительность активной фазы, сек (hold)
  rampup: 60              # сек разгон
  scenarios:
    FinmonWeb:            # TODO: имя должно совпадать с SCN в вашем сценарии (ProfileConfig)
      users: 10           # целевая интенсивность на 100% профиля
      request_classes:    # запросы сценария (для долей весов); можно тот же класс
        - gatling/src/test/java/cases/efsFinmonWeb/FinmonWebCase.java   # TODO: реальный путь

